<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supplier Health Scorecard — SmartFlow Supply</title>
  <meta name="description" content="AI-powered supplier health scoring for supply chain managers. Identify high-risk suppliers with Gemini AI scores." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style_supply.css" />
</head>
<body class="supplier-page">

  <nav class="nav">
    <a class="nav-brand" href="dashboard_supply.html">
      <div class="logo-icon">SF</div>
      <span class="nav-title">SmartFlow <span>Supply</span></span>
    </a>
    <div class="nav-links" id="navLinks"><!-- injected by JS --></div>
    <div style="display:flex;align-items:center;gap:8px;">
      <div style="position:relative;">
        <button class="notif-btn" id="notifBtn" title="Notifications">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span class="notif-badge hidden" id="notifBadge">0</span>
        </button>
        <div class="notif-dropdown hidden" id="notifDropdown">
          <div class="notif-header">Notifications</div>
          <div id="notifList"><div class="notif-empty">No new notifications</div></div>
        </div>
      </div>
      <div class="user-pill">
        <span class="user-pill-dot"></span>
        <span id="userEmail">—</span>
      </div>
    </div>
  </nav>

  <div class="page-wrapper">

    <div class="page-header">
      <h1>Supplier Health Scorecard</h1>
      <p>Real-time AI health scoring for all suppliers — powered by Gemini</p>
    </div>

    <!-- Search + Filter Controls -->
    <div class="supplier-controls">
      <input
        class="search-input"
        type="text"
        id="supplierSearch"
        placeholder="Search by supplier name or location…"
      />
      <div class="health-filter-btns">
        <button class="health-filter-btn active" data-health="all">All</button>
        <button class="health-filter-btn" data-health="Reliable">Reliable</button>
        <button class="health-filter-btn" data-health="Watch">Watch</button>
        <button class="health-filter-btn" data-health="High Risk">High Risk</button>
      </div>
    </div>

    <!-- Loading State -->
    <div class="supplier-loading" id="supplierLoadingBox">
      <div class="spinner"></div>
      <p>Gemini is scoring all 6 suppliers…</p>
    </div>

    <!-- Suppliers Grid -->
    <div class="suppliers-grid" id="suppliersGrid">
      <!-- Supplier cards injected by main_supply.js -->
    </div>

  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="data_supply.js"></script>
  <script src="firebase_supply.js"></script>
  <script src="gemini_supply.js"></script>
  <script src="main_supply.js"></script>
</body>
</html>
