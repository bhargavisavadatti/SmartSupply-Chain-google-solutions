<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartFlow Supply — Sign In</title>
  <meta name="description" content="SmartFlow Supply — AI-powered supply chain financial intelligence for supply chain managers, finance officers, and executives." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style_supply.css" />
</head>
<body class="login-page">

  <div class="login-wrapper">

    <!-- Brand -->
    <div class="login-brand">
      <div class="login-logo">SF</div>
      <div>
        <div class="login-brand-name">SmartFlow <span>Supply</span></div>
        <div class="login-tagline">Predict Disruptions. Protect Your Finances.</div>
      </div>
    </div>

    <!-- Login Card -->
    <div class="login-card">

      <div class="section-label">Select Your Role</div>
      <div class="role-cards">
        <div class="role-card" data-role="Supply Chain Manager" id="role-scm">
          <div class="role-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 3h15v13H1z"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg></div>
          <div class="role-title">Supply Chain Manager</div>
        </div>
        <div class="role-card" data-role="Finance Officer" id="role-finance">
          <div class="role-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/></svg></div>
          <div class="role-title">Finance Officer</div>
        </div>
        <div class="role-card" data-role="Executive" id="role-exec">
          <div class="role-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 1 0-16 0"/></svg></div>
          <div class="role-title">Executive</div>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label" for="email">Work Email</label>
        <input class="field-input" type="email" id="email" placeholder="you@company.com" autocomplete="email" />
      </div>

      <div class="field-group">
        <label class="field-label" for="password">Password</label>
        <input class="field-input" type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
      </div>

      <button class="btn-login" id="loginBtn">Sign In →</button>

    </div>

    <!-- Stat pills -->
    <div class="stat-pills">
      <div class="stat-pill">
        <div class="stat-pill-value">6</div>
        <div class="stat-pill-label">Shipments</div>
      </div>
      <div class="stat-pill-divider"></div>
      <div class="stat-pill">
        <div class="stat-pill-value" style="color:var(--danger)">2</div>
        <div class="stat-pill-label">Disrupted</div>
      </div>
      <div class="stat-pill-divider"></div>
      <div class="stat-pill">
        <div class="stat-pill-value" style="color:var(--warning)">2</div>
        <div class="stat-pill-label">At Risk</div>
      </div>
      <div class="stat-pill-divider"></div>
      <div class="stat-pill">
        <div class="stat-pill-value" style="color:var(--warning)">₹1.2L</div>
        <div class="stat-pill-label">Exposure</div>
      </div>
    </div>

  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="data_supply.js"></script>
  <script src="firebase_supply.js"></script>
  <script src="main_supply.js"></script>
</body>
</html>
